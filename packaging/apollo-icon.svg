<?xml version="1.0" encoding="UTF-8"?>
<!--
  Apollo app icon — the product's own sail mark (from the welcome screen,
  static/index.html) set in the Helios palette that ships as the default
  theme: deep night-blue ground, solar-gold mark.

  Previously the macOS icon was generated by center-cropping a SCREENSHOT
  (docs/apollo.jpg) and the PWA icons were a screenshot of the pre-rename
  "Odysseus" UI — so the app shipped with no real logo at all.

  Rendered to PNG with rsvg-convert, then to a true multi-resolution .icns
  with iconutil (see packaging/make-icon.sh).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222a3d"/>
      <stop offset="55%" stop-color="#141a27"/>
      <stop offset="100%" stop-color="#0b0f18"/>
    </linearGradient>

    <!-- Warm light pooling behind the sail, so the gold reads as lit rather than flat. -->
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#e3aa4e" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#e3aa4e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e3aa4e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sail" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f5c877"/>
      <stop offset="52%" stop-color="#e3aa4e"/>
      <stop offset="100%" stop-color="#c98c34"/>
    </linearGradient>

    <!-- Hairline top edge: the standard macOS cue that the tile has depth. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- macOS tile: ~9% margin, squircle-ish 22% corner radius. -->
  <g>
    <rect x="92" y="92" width="840" height="840" rx="188" ry="188" fill="url(#ground)"/>
    <rect x="92" y="92" width="840" height="840" rx="188" ry="188" fill="url(#glow)"/>
    <rect x="92" y="92" width="840" height="840" rx="188" ry="188" fill="url(#rim)"/>
    <rect x="92.5" y="92.5" width="839" height="839" rx="187.5" ry="187.5"
          fill="none" stroke="#e3aa4e" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- The app's own mark (32x32 source) scaled to the tile and centred.
       translate/scale keeps the original path data verbatim so the icon and
       the in-app glyph can never drift apart. -->
  <g transform="translate(512 512) scale(19.6) translate(-16 -16.6)">
    <path d="M16 3C19 6 20.5 11 20.5 15C20.5 18 19.5 20 18.5 21L13.5 21C12.5 20 11.5 18 11.5 15C11.5 11 13 6 16 3Z"
          fill="url(#sail)"/>
    <path d="M11.5 16L7.5 22L11.5 20.5Z M20.5 16L24.5 22L20.5 20.5Z"
          fill="#e3aa4e" opacity="0.62"/>
    <path d="M13 21.5Q16 28 19 21.5"
          stroke="#e3aa4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
