name: Build desktop bundles

# Package validation runs for release-affecting pull requests and can be
# repeated manually. Uploads are workflow artifacts only; publication is a
# separate reviewed release step.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version"
        required: true
        default: "1.1.0-rc.1"
  pull_request:
    paths:
      - "app.py"
      - "build-macos-bundle.sh"
      - "packaging/**"
      - "scripts/build-windows-bundle.ps1"
      - "scripts/smoke_packaged.py"
      - "tests/test_packaging_boot.py"
      - "requirements*.txt"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

env:
  APOLLO_VERSION: ${{ inputs.version || '1.1.0-rc.1' }}

jobs:
  macos:
    name: macOS arm64 DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked runtime and packaging dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements-dev.txt pyinstaller
      - name: Build macOS bundle
        run: ./build-macos-bundle.sh
      - name: Smoke packaged server
        run: |
          mkdir -p "$RUNNER_TEMP/apollo-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/apollo-dmg" "dist/Apollo-${APOLLO_VERSION}.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/apollo-dmg" >/dev/null 2>&1 || true' EXIT
          venv/bin/python scripts/smoke_packaged.py \
            --binary "$RUNNER_TEMP/apollo-dmg/Apollo.app/Contents/Resources/apollo/apollo"
      - name: Write checksums and source metadata
        run: |
          (
            cd dist
            shasum -a 256 "Apollo-${APOLLO_VERSION}.dmg" > "Apollo-${APOLLO_VERSION}.dmg.sha256"
            git -C .. rev-parse HEAD > "Apollo-${APOLLO_VERSION}.source.txt"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-${{ env.APOLLO_VERSION }}-macos-arm64
          path: |
            dist/Apollo-${{ env.APOLLO_VERSION }}.dmg
            dist/Apollo-${{ env.APOLLO_VERSION }}.dmg.sha256
            dist/Apollo-${{ env.APOLLO_VERSION }}.source.txt
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Windows x64 portable ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build Windows bundle
        shell: pwsh
        env:
          APOLLO_DIAG_DLL_IMPORTS: "1"
        timeout-minutes: 10
        run: .\scripts\build-windows-bundle.ps1 -Python python -Version $env:APOLLO_VERSION
      - name: Smoke packaged server
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "apollo-portable"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path "dist\Apollo-$env:APOLLO_VERSION-windows-x64.zip" -DestinationPath $extract
          python scripts/smoke_packaged.py --binary (Join-Path $extract "Apollo\Apollo.exe")
      - name: Write checksums and source metadata
        shell: pwsh
        run: |
          $zip = "dist\Apollo-$env:APOLLO_VERSION-windows-x64.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  " + (Split-Path $zip -Leaf) | Set-Content "$zip.sha256"
          git rev-parse HEAD | Set-Content "dist\Apollo-$env:APOLLO_VERSION-windows-x64.source.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-${{ env.APOLLO_VERSION }}-windows-x64
          path: |
            dist/Apollo-${{ env.APOLLO_VERSION }}-windows-x64.zip
            dist/Apollo-${{ env.APOLLO_VERSION }}-windows-x64.zip.sha256
            dist/Apollo-${{ env.APOLLO_VERSION }}-windows-x64.source.txt
          if-no-files-found: error
          retention-days: 90
